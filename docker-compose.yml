services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: winerate
      POSTGRES_USER: winerate
      POSTGRES_PASSWORD: winerate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winerate -d winerate"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://winerate:winerate@db:5432/winerate
      DJANGO_DEBUG: "True"          # local: sem redirecionamento HTTPS
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

volumes:
  pgdata:
