{% extends "web/base.html" %}
{% load static %}
{% block title %}Criar conta · Wine Rate{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
  <div class="text-center mb-4">
    <i class="fa-solid fa-wine-glass auth-logo"></i>
    <h1 class="h3 mt-2 brand-title">Criar conta</h1>
  </div>
  <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
  <form id="authForm" data-mode="register" novalidate>
    <div class="mb-3">
      <label class="form-label" for="name">Nome</label>
      <input class="form-control" id="name" name="name" autocomplete="name" maxlength="150" required>
      <div class="invalid-feedback" data-error-for="name"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
      <div class="invalid-feedback" data-error-for="email"></div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Senha <span class="text-muted small">(mínimo de 8 caracteres)</span></label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <div class="invalid-feedback" data-error-for="password"></div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Criar conta</button>
  </form>
  <p class="text-center mt-4 mb-0 small">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'web/js/auth.js' %}"></script>{% endblock %}
