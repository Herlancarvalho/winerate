databases:
  - name: winerate-db
    plan: free          # troque por um plano pago em produção
    databaseName: winerate
    user: winerate

services:
  - type: web
    name: winerate
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 3 --timeout 60"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: winerate-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: winerate.onrender.com   # ajuste para o seu domínio
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://winerate.onrender.com
      - key: LABEL_VISION_PROVIDER
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false      # informe no painel; nunca no repositório
